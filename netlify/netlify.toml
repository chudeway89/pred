[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# All routes (including /services, /about, etc) handled by the SPA hash router
# fall through to index.html naturally — no rewrites required.
